name: Build/release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v3.4.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: macos-15

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build GUI
        run: npm run build:gui

  release:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-15

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish tagged release
        if: github.event_name == 'push'
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match package version $EXPECTED_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi

      - name: Build manual release
        if: github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Publish manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            dist/fri3d-badge-fixer-* \
            dist/latest-*.yml \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_VERSION" \
            --generate-notes
